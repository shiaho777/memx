<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="880" height="330" fill="#FFFFFF"/>
  <text x="440" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">FullHost timeline — one epoch per phase, load to capability</text>

  <!-- epoch lane: 6 blocks w=126 gap=15, x = 24 + i*141 -->
  <rect x="24" y="56" width="126" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="87" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">LOAD</text>
  <text x="87" y="90" text-anchor="middle" font-size="9.5" fill="#475569">host weights</text>
  <rect x="165" y="56" width="126" height="40" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <text x="228" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">COMPRESS</text>
  <text x="228" y="90" text-anchor="middle" font-size="9.5" fill="#475569">vault-native seal</text>
  <rect x="306" y="56" width="126" height="40" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="369" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#5B21B6">EXPORT</text>
  <text x="369" y="90" text-anchor="middle" font-size="9.5" fill="#475569">capsule (clone)</text>
  <rect x="447" y="56" width="126" height="40" rx="8" fill="#D1FAE5" stroke="#059669"/>
  <text x="510" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">INFER</text>
  <text x="510" y="90" text-anchor="middle" font-size="9.5" fill="#475569">streaming hot window</text>
  <rect x="588" y="56" width="126" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="651" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">SEAL</text>
  <text x="651" y="90" text-anchor="middle" font-size="9.5" fill="#475569">fold + phoenix</text>
  <rect x="729" y="56" width="126" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="792" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">VESSEL</text>
  <text x="792" y="90" text-anchor="middle" font-size="9.5" fill="#475569">attach → materialize</text>

  <!-- decision points -->
  <polygon points="264,115 278,128 264,141 250,128" fill="#D1FAE5" stroke="#059669"/>
  <text x="288" y="131" font-size="9.5" fill="#047857">export: milliseconds when clone=1</text>
  <polygon points="520,115 534,128 520,141 506,128" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="544" y="131" font-size="9.5" fill="#B91C1C">soft trim(32) only</text>

  <!-- memory lane -->
  <text x="24" y="189" font-size="10.5" fill="#475569">weights</text>
  <text x="24" y="203" font-size="10.5" fill="#475569">memory</text>
  <rect x="130" y="172" width="200" height="40" rx="8" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text x="230" y="196" text-anchor="middle" font-size="10" fill="#5B21B6">compressed cold pages — SCR-backed</text>
  <rect x="447" y="172" width="78" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-dasharray="5 3"/>
  <text x="486" y="191" text-anchor="middle" font-size="9.5" fill="#92400E">RETIRE</text>
  <text x="486" y="203" text-anchor="middle" font-size="9.5" fill="#92400E">async seal</text>
  <rect x="530" y="172" width="84" height="40" rx="8" fill="#2563EB"/>
  <text x="572" y="196" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">HOT strip</text>
  <rect x="619" y="172" width="88" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-dasharray="5 3"/>
  <text x="663" y="191" text-anchor="middle" font-size="9.5" fill="#1D4ED8">PREFETCH</text>
  <text x="663" y="203" text-anchor="middle" font-size="9.5" fill="#1D4ED8">staged ahead</text>
  <path d="M455 226 H695" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="695,220 695,232 707,226" fill="#94A3B8"/>
  <text x="575" y="240" text-anchor="middle" font-size="9.5" fill="#64748B">hot window advances strip by strip</text>

  <!-- baseline + ticks -->
  <line x1="24" y1="254" x2="856" y2="254" stroke="#CBD5E1"/>
  <text x="87" y="268" text-anchor="middle" font-size="9.5" fill="#94A3B8">EPOCH_LOAD</text>
  <text x="228" y="268" text-anchor="middle" font-size="9.5" fill="#94A3B8">EPOCH_COMPRESS</text>
  <text x="369" y="268" text-anchor="middle" font-size="9.5" fill="#94A3B8">capsule export</text>
  <text x="510" y="268" text-anchor="middle" font-size="9.5" fill="#94A3B8">EPOCH_INFER · ~0.40 s</text>
  <text x="651" y="268" text-anchor="middle" font-size="9.5" fill="#94A3B8">EPOCH_FINAL</text>
  <text x="792" y="268" text-anchor="middle" font-size="9.5" fill="#94A3B8">capability ~5 MB</text>

  <rect x="24" y="278" width="832" height="40" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="440" y="294" text-anchor="middle" font-size="10.5" fill="#475569">Prefetch stages ahead without growing the durable hot set; the RETIRE trail seals asynchronously, off the infer hot path.</text>
  <text x="440" y="310" text-anchor="middle" font-size="10.5" fill="#475569">No seal_flush inside matmul; hard trim before infer risks SIGBUS — phoenix seal folds zones after the last epoch.</text>
</svg>
