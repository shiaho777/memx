<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="880" height="350" fill="#FFFFFF"/>
  <text x="440" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Measured memory planes — Qwen3.5-0.8B FullHost (weights ≈ 1.66 GB)</text>
  <text x="440" y="54" text-anchor="middle" font-size="10.5" fill="#475569">three surfaces, one workload — the × numbers carry the precision, short bars carry the message</text>

  <!-- gridlines: x = 300 + v/1660*470 ; 0→300  400→413  800→527  1200→640  1600→753 -->
  <line x1="300" y1="66" x2="300" y2="244" stroke="#E2E8F0"/>
  <line x1="413" y1="66" x2="413" y2="244" stroke="#E2E8F0"/>
  <line x1="527" y1="66" x2="527" y2="244" stroke="#E2E8F0"/>
  <line x1="640" y1="66" x2="640" y2="244" stroke="#E2E8F0"/>
  <line x1="753" y1="66" x2="753" y2="244" stroke="#E2E8F0"/>
  <text x="300" y="260" text-anchor="middle" font-size="9.5" fill="#94A3B8">0</text>
  <text x="413" y="260" text-anchor="middle" font-size="9.5" fill="#94A3B8">400 MB</text>
  <text x="527" y="260" text-anchor="middle" font-size="9.5" fill="#94A3B8">800 MB</text>
  <text x="640" y="260" text-anchor="middle" font-size="9.5" fill="#94A3B8">1,200 MB</text>
  <text x="753" y="260" text-anchor="middle" font-size="9.5" fill="#94A3B8">1,600 MB</text>

  <!-- logical: 1660/1660*470 = 470 -->
  <text x="292" y="92" text-anchor="end" font-size="11" fill="#334155" font-weight="600">Logical weights</text>
  <rect x="300" y="76" width="470" height="30" ry="4" fill="#CBD5E1" stroke="#94A3B8"/>
  <text x="778" y="96" font-size="11" fill="#475569">1,660 MB</text>

  <!-- phys: 180/1660*470 = 50.96 → 51 -->
  <text x="292" y="127" text-anchor="end" font-size="11" fill="#334155" font-weight="600">Phys footprint</text>
  <text x="292" y="139" text-anchor="end" font-size="9.5" fill="#94A3B8">task_vm_info</text>
  <rect x="300" y="122" width="51" height="30" ry="4" fill="#2563EB"/>
  <text x="359" y="142" font-size="11" font-weight="700" fill="#1D4ED8">~180 MB · ~9×</text>

  <!-- engine cold: 16/1660*470 = 4.53 → below min, shown at 6 -->
  <text x="292" y="173" text-anchor="end" font-size="11" fill="#334155" font-weight="600">Engine cold</text>
  <text x="292" y="185" text-anchor="end" font-size="9.5" fill="#94A3B8">after phoenix seal</text>
  <rect x="300" y="168" width="6" height="30" ry="3" fill="#7C3AED"/>
  <text x="314" y="188" font-size="11" font-weight="700" fill="#6D28D9">~16 MB · ~100×</text>

  <!-- vessel rss: 5/1660*470 = 1.42 → below min, shown at 6 -->
  <text x="292" y="219" text-anchor="end" font-size="11" fill="#334155" font-weight="600">Vessel RSS</text>
  <text x="292" y="231" text-anchor="end" font-size="9.5" fill="#94A3B8">capability plane</text>
  <rect x="300" y="214" width="6" height="30" ry="3" fill="#059669"/>
  <text x="314" y="234" font-size="11" font-weight="700" fill="#047857">~5 MB · ~300×</text>

  <rect x="180" y="282" width="520" height="34" rx="17" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="440" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">~100× is the stable center — each plane measures a different surface</text>
  <text x="440" y="338" text-anchor="middle" font-size="9.5" fill="#94A3B8">ps RSS can still show large external / COW file-cache residency — OS accounting, not required process RAM</text>
</svg>
