<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="880" height="300" fill="#FFFFFF"/>
  <text x="440" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">SCR capsule — three files, three attach modes</text>

  <rect x="24" y="60" width="380" height="52" rx="10" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="40" y="81" font-size="12.5" font-weight="700" fill="#5B21B6">spill.bin</text>
  <text x="40" y="99" font-size="10.5" fill="#475569">compressed page fabric · APFS clone / hardlink when FS allows</text>
  <rect x="24" y="124" width="380" height="52" rx="10" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="40" y="145" font-size="12.5" font-weight="700" fill="#1E3A8A">ledger.bin</text>
  <text x="40" y="163" font-size="10.5" fill="#475569">page catalog: pidx · csz · off · codec</text>
  <rect x="24" y="188" width="380" height="52" rx="10" fill="#D1FAE5" stroke="#059669"/>
  <text x="40" y="209" font-size="12.5" font-weight="700" fill="#065F46">rank.map</text>
  <text x="40" y="227" font-size="10.5" fill="#475569">dense O(1) rank index for lite attach</text>

  <rect x="428" y="60" width="428" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="440" y="76" font-size="9.5" font-weight="700" fill="#64748B">MODE</text>
  <text x="520" y="76" font-size="9.5" font-weight="700" fill="#64748B">LEDGER BEHAVIOR</text>
  <text x="700" y="76" font-size="9.5" font-weight="700" fill="#64748B">USE</text>

  <rect x="428" y="88" width="428" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="440" y="112" font-size="11.5" font-weight="700" fill="#0F172A">Full</text>
  <text x="520" y="112" font-size="10" fill="#475569">ledger mapped in process</text>
  <text x="700" y="112" font-size="9.5" fill="#94A3B8">host-side tooling</text>

  <rect x="428" y="132" width="428" height="40" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="440" y="156" font-size="11.5" font-weight="700" fill="#92400E">Lite</text>
  <text x="520" y="156" font-size="10" fill="#475569">ledger on demand via pread</text>
  <text x="700" y="156" font-size="9.5" fill="#B45309">default · vessel / host bind</text>

  <rect x="428" y="176" width="428" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="440" y="200" font-size="11.5" font-weight="700" fill="#0F172A">Rank</text>
  <text x="520" y="200" font-size="10" fill="#475569">materialize_rank · dense index</text>
  <text x="700" y="200" font-size="9.5" fill="#94A3B8">fast materialize</text>

  <rect x="24" y="252" width="832" height="36" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="440" y="274" text-anchor="middle" font-size="10.5" fill="#0F172A">Ultralite vessel: attach → materialize_rank → ~5 MB RSS capability plane, no Torch in the process.</text>
</svg>
